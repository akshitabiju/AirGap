<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04141a;font-family:Inter,system-ui,sans-serif;color:#f4f7f6}
  .sky{position:absolute;inset:0;background:
    radial-gradient(110% 60% at 50% 115%, rgba(94,234,212,.28) 0%, rgba(56,189,248,.16) 30%, rgba(4,20,26,0) 62%),
    radial-gradient(55% 40% at 15% 15%, rgba(129,140,248,.18), transparent 70%),
    linear-gradient(180deg,#03111a 0%,#04141a 40%,#0b2a33 78%,#0f3a44 100%)}
  .haze{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;animation:drift 6s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(-4%,0) scale(1)}to{transform:translate(4%,-5%) scale(1.1)}}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mark{width:84px;height:84px;border-radius:22px;background:#f4f7f6;display:grid;place-items:center;opacity:0;animation:pop .7s cubic-bezier(.16,1,.3,1) .2s forwards;box-shadow:0 0 60px rgba(94,234,212,.35)}
  @keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
  h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:132px;letter-spacing:-.03em;margin:22px 0 0;line-height:1;opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .6s forwards}
  h1 em{font-style:italic;color:#5eead4}
  @keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  p{font-size:26px;color:rgba(244,247,246,.75);margin:18px 0 0;letter-spacing:.02em;opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) 1.15s forwards}
  .line{width:0;height:2px;background:linear-gradient(90deg,transparent,#5eead4,transparent);margin-top:26px;animation:grow 1.2s ease 1.5s forwards}
  @keyframes grow{to{width:520px}}
  canvas{position:absolute;inset:0}
  .fade{position:absolute;inset:0;background:#04141a;opacity:0;animation:out .5s ease 3.4s forwards}
  @keyframes out{to{opacity:1}}
</style></head><body>
<div class="sky"></div>
<div class="haze" style="width:60vw;height:50vh;left:-10vw;top:30%;background:rgba(56,189,248,.22)"></div>
<div class="haze" style="width:50vw;height:40vh;right:-10vw;top:10%;background:rgba(94,234,212,.2);animation-delay:-3s"></div>
<canvas id="p"></canvas>
<div class="wrap">
  <div class="mark"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0f4c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg></div>
  <h1>Air<em>Gap</em></h1>
  <p>Today's air, for every district in India. Even the ones with no monitor.</p>
  <div class="line"></div>
</div>
<div class="fade"></div>
<script>
const cv=document.getElementById('p'),ctx=cv.getContext('2d');let w,h;const R=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight};R();addEventListener('resize',R)
const pts=Array.from({length:420},()=>({x:Math.random(),y:Math.random(),a:Math.random()}))
const f=(x,y,t)=>Math.sin(x*3.1+t*.00022)*Math.cos(y*2.3-t*.00017)+.35*Math.sin((x+y)*5.2+t*.0003)
;(function step(t){requestAnimationFrame(step);ctx.clearRect(0,0,w,h);for(const p of pts){const a=f(p.x,p.y,t)*Math.PI,s=.0006+.0005*p.a;p.x+=Math.cos(a)*s*1.4;p.y+=Math.sin(a)*s;if(p.x<-.02||p.x>1.02||p.y<-.02||p.y>1.02){p.x=Math.random();p.y=Math.random()}
const warm=p.a>.75;ctx.beginPath();ctx.arc(p.x*w,p.y*h,warm?1.8:1.1,0,Math.PI*2);ctx.fillStyle=warm?`rgba(94,234,212,${.35+.4*p.a})`:`rgba(244,247,246,${.12+.22*p.a})`;ctx.fill()}})(0)
</script>
</body></html>
